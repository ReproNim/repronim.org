# Hugo configuration file
title: ReproNim

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

services:
  googleAnalytics:
    id: G-X5H9L7F90E

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Home
      pageRef: "/"
      weight: 1
    - name: About
      pageRef: /about/
      weight: 5
    - name: Resources
      pageRef: /resources/
      weight: 10
    - name: Fellowship
      pageRef: /fellowship/
      weight: 15
    - name: Participate
      pageRef: /participate/
      weight: 20
    - name: News
      pageRef: /news/
      weight: 25
    - name: Help
      pageRef: /help/
      weight: 100
    - name: Search
      weight: 200
      params:
        type: search

params:
  # Site author info — read by the local RSS template override at
  # layouts/_default/list.rss.xml. Hextra v0.8.3 ships a template that
  # references the legacy .Site.Author, which Hugo 0.160+ no longer
  # provides; the override reads from site.Params.author instead.
  author:
    name: ReproNim
    email: info@repronim.org

  navbar:
    displayTitle: ReproNim
    displayLogo: true
    logo:
      path: images/square-512T2.png
      width: 50

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/ReproNIM/repronim.org/edit/main/content"

  theme:
    # light | dark | system
    default: light
    displayToggle: true
